name: MarketDesign.ai collectors

on:
  # The collectors are started by the TRACK worker on Cloudflare's timer, four
  # times a day. GitHub's own scheduler ran this workflow four to seven hours
  # late and dropped more slots every month (four a day in September 2026, one
  # by 23 November), so it is kept only as a once-a-day fallback that stands
  # down when a run has reported recently (see fallback-gate).
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Collector mode"
        type: choice
        options: [dry-run, submit, bootstrap]
        default: dry-run
      source:
        description: "Source key or 'all'"
        type: choice
        options: [all, terna, eex, elia, ferc, caiso, nyiso, miso, pjm, spp, pjm-imm, potomac, spp-mmu, nerc, texas-register, entsoe-consultations, cre, bnetza, ofgem, rte, neso, german-tsos, jao, nemo, aib, nbm, dgclima, creg, acm, elexon, arera, ceer, recs, energinet, tennet, nordpool, omie, gme, epex, cnmc, ure, pse, eirgrid, eur-lex, eu-dso, acer, entsoe, commission, swissgrid, elcom, bfe, admie, agen-rs, anre, apg, ast, at-gov, bg-gov, brugel, bsp, creos, cropex, cru, cwape, desnz, dk-gov, econtrol, ee-gov, ei, elering, eles, erse, eru, eso, fingrid, forsyningstilsynet, fr-gov, henex, hera, hops, hr-gov, hu-gov, hupx, ilr, kevr, konkurentsiamet, lccc, lv-gov, mase, mekh, miteco, nl-gov, okte, omip, opcom, ote, pl-gov, pt-gov, raaey, ree, ren, rme, se-gov, sem-committee, semo, seps, si-gov, soni, sprk, statnett, svk, tge, transelectrica, tsoc, uregni, urso, vreg]
        default: all
      limit:
        description: "Max documents per source"
        default: "25"

concurrency:
  group: collectors
  cancel-in-progress: false

jobs:
  # A scheduled run is a fallback: it goes ahead only if no collector has
  # reported for ten hours, which means the worker's trigger has failed. If the
  # status cannot be read, it goes ahead.
  fallback-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          MIN=$(curl -s -m 30 https://marketdesign.ai/api/track/collector-trigger | python3 -c "import json,sys; v=json.load(sys.stdin).get('last_report_minutes'); print(v if isinstance(v,int) else -1)" 2>/dev/null || echo -1)
          echo "last collector report: ${MIN} min ago"
          if [ "$MIN" -ge 0 ] && [ "$MIN" -lt 600 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  collect:
    runs-on: ubuntu-latest
    needs: fallback-gate
    if: needs.fallback-gate.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || vars.TRACK_AUTOMATION_ENABLED == 'true')
    strategy:
      fail-fast: false
      # Four at a time: the fleet passed 120 sources, each on its own host, and
      # two at a time made a run outlast the gap to the next one's start.
      max-parallel: 4
      matrix:
        source: [cre, bnetza, ofgem, rte, neso, german-tsos, jao, nemo, aib, nbm, dgclima, creg, acm, elexon, arera, ceer, recs, energinet, nordpool, omie, gme, epex, cnmc, ure, pse, eirgrid, eur-lex, eu-dso, acer, entsoe, commission, caiso, miso, pjm, spp, pjm-imm, potomac, spp-mmu, texas-register, entsoe-consultations, elia, swissgrid, elcom, bfe, admie, agen-rs, anre, apg, ast, at-gov, bg-gov, brugel, bsp, creos, cropex, cru, cwape, desnz, dk-gov, econtrol, ee-gov, ei, elering, eles, erse, eru, eso, fingrid, forsyningstilsynet, fr-gov, henex, hera, hops, hr-gov, hu-gov, hupx, ilr, kevr, konkurentsiamet, lccc, lv-gov, mase, mekh, miteco, nl-gov, okte, omip, opcom, ote, pl-gov, pt-gov, raaey, ree, ren, rme, se-gov, sem-committee, semo, seps, si-gov, soni, sprk, statnett, svk, tge, transelectrica, tsoc, uregni, urso, vreg]
    steps:
      - name: Skip if a single source was requested
        id: gate
        run: |
          REQ="${{ github.event.inputs.source || 'all' }}"
          if [ "$REQ" != "all" ] && [ "$REQ" != "${{ matrix.source }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Restore collector state
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state
          # The key ends the source name with "_" so that one source's prefix
          # cannot match another's: "state-spp-" also matched "state-spp-mmu-…",
          # and spp, entsoe and pjm kept restoring their sibling's state and so
          # had none of their own. The old prefix stays as a fallback for the
          # first run after this change.
          key: state2-${{ matrix.source }}_${{ github.run_id }}
          restore-keys: |
            state2-${{ matrix.source }}_
            state-${{ matrix.source }}-

      - name: Run collector
        if: steps.gate.outputs.run == 'true'
        env:
          TRACK_INGEST_URL: ${{ vars.TRACK_INGEST_URL }}
          TRACK_INGEST_TOKEN: ${{ secrets.TRACK_INGEST_TOKEN }}
          # The monitor carries today's news. A document first seen more than
          # a day after it was published is baselined, not submitted.
          MAX_AGE_DAYS: "1"
        run: |
          set -o pipefail
          MODE="${{ github.event.inputs.mode || 'submit' }}"
          LIMIT="${{ github.event.inputs.limit || '25' }}"
          case "$MODE" in
            submit)    FLAG="--submit" ;;
            bootstrap) FLAG="--bootstrap-state" ;;
            *)         FLAG="--dry-run" ;;
          esac
          python core.py --source "${{ matrix.source }}" $FLAG --limit "$LIMIT" --json \
            | tee "run-report-${{ matrix.source }}.json"

      - name: Save collector state
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state2-${{ matrix.source }}_${{ github.run_id }}

      - name: Upload run report
        # Diagnostic only: a collector that ran must not fail because GitHub's
        # artifact service refused to store its report.
        if: steps.gate.outputs.run == 'true' && always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.source }}-${{ github.run_id }}
          path: run-report-${{ matrix.source }}.json
          retention-days: 14

  collect-rendered:
    runs-on: ubuntu-latest
    needs: fallback-gate
    if: needs.fallback-gate.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || vars.TRACK_AUTOMATION_ENABLED == 'true')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [terna, eex, ferc, nyiso, tennet, nerc]
    steps:
      - name: Skip if a single source was requested
        id: gate
        run: |
          REQ="${{ github.event.inputs.source || 'all' }}"
          if [ "$REQ" != "all" ] && [ "$REQ" != "${{ matrix.source }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      # These publishers render their listings and article bodies client-side,
      # so the collector drives the browser the runner already ships.
      - name: Locate Chrome
        if: steps.gate.outputs.run == 'true'
        run: |
          BIN="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BIN" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser
            BIN="$(command -v chromium-browser || command -v chromium)"
          fi
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version

      - name: Restore collector state
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state
          # The key ends the source name with "_" so that one source's prefix
          # cannot match another's: "state-spp-" also matched "state-spp-mmu-…",
          # and spp, entsoe and pjm kept restoring their sibling's state and so
          # had none of their own. The old prefix stays as a fallback for the
          # first run after this change.
          key: state2-${{ matrix.source }}_${{ github.run_id }}
          restore-keys: |
            state2-${{ matrix.source }}_
            state-${{ matrix.source }}-

      - name: Run collector
        if: steps.gate.outputs.run == 'true'
        env:
          TRACK_INGEST_URL: ${{ vars.TRACK_INGEST_URL }}
          TRACK_INGEST_TOKEN: ${{ secrets.TRACK_INGEST_TOKEN }}
          # The monitor carries today's news. A document first seen more than
          # a day after it was published is baselined, not submitted.
          MAX_AGE_DAYS: "1"
          CHROME_BIN: ${{ env.CHROME_BIN }}
        run: |
          set -o pipefail
          MODE="${{ github.event.inputs.mode || 'submit' }}"
          LIMIT="${{ github.event.inputs.limit || '25' }}"
          case "$MODE" in
            submit)    FLAG="--submit" ;;
            bootstrap) FLAG="--bootstrap-state" ;;
            *)         FLAG="--dry-run" ;;
          esac
          python core.py --source "${{ matrix.source }}" $FLAG --limit "$LIMIT" --json \
            | tee "run-report-${{ matrix.source }}.json"

      - name: Save collector state
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state2-${{ matrix.source }}_${{ github.run_id }}

      - name: Upload run report
        # Diagnostic only: a collector that ran must not fail because GitHub's
        # artifact service refused to store its report.
        if: steps.gate.outputs.run == 'true' && always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ matrix.source }}-${{ github.run_id }}
          path: run-report-${{ matrix.source }}.json
          retention-days: 14
